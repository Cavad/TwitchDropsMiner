name: Windows desktop EXE

on:
  push:
    branches: [codex/windows-desktop]
  workflow_dispatch:
  pull_request:
    paths:
      - desktop/**
      - desktop_main.py
      - src/**
      - tests/**
      - packaging/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/desktop-windows.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Core regressions (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked dependencies
        shell: bash
        run: |
          python -m venv env
          source env/bin/activate
          uv sync --active --locked --extra dev --python 3.12
      - name: Lint and run full regression suite
        shell: bash
        run: |
          source env/bin/activate
          python -m ruff check src desktop desktop_main.py tests/test_desktop.py tests/test_desktop_features.py tests/test_windows_browser.py tests/test_mining_health.py tests/test_overnight_recap.py
          python -m pytest -q --junitxml=core-tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-core-test-results
          path: core-tests.xml
          if-no-files-found: warn
          archive: true
          retention-days: 14

  windows:
    name: Test and build Windows x64
    runs-on: windows-2022
    needs: regression
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked runtime and pinned desktop build tools
        run: |
          python -m venv env
          . ./env/Scripts/Activate.ps1
          uv sync --active --locked --extra dev --python 3.12
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
          uv pip install -r packaging/desktop-requirements.txt -r packaging/login-helper-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed' }
      - name: Test native UI, session recovery and Windows browser ownership
        run: |
          . ./env/Scripts/Activate.ps1
          python -m pytest tests/test_desktop.py tests/test_desktop_features.py tests/test_windows_browser.py tests/test_mining_health.py tests/test_overnight_recap.py tests/test_session_controller.py tests/test_server_renewal.py tests/test_renewal_profile_cleanup.py tests/test_helper_diagnostics.py tests/test_priority_fallback.py tests/test_reward_priority.py tests/test_wanted_queue_order.py -q --junitxml=desktop-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop tests failed' }
      - name: Build portable desktop EXE
        run: |
          . ./env/Scripts/Activate.ps1
          python -m PyInstaller --clean --noconfirm packaging/desktop.spec
          if ($LASTEXITCODE -ne 0) { throw 'Desktop packaging failed' }
      - name: Verify packaged application outside the source tree
        timeout-minutes: 4
        run: |
          $exe = (Resolve-Path 'dist/Twitch Drops Miner.exe').Path
          $temporary = Join-Path $env:RUNNER_TEMP 'tdm-standalone-check'
          New-Item -ItemType Directory -Force -Path $temporary | Out-Null
          $report = Join-Path $temporary 'build-verification.json'
          $previousPath = $env:PATH
          $previousPythonPath = $env:PYTHONPATH
          $previousPythonHome = $env:PYTHONHOME
          $previousEnvironment = $env:VIRTUAL_ENV
          try {
            $env:PATH = ''
            $env:PYTHONPATH = ''
            $env:PYTHONHOME = ''
            Remove-Item Env:VIRTUAL_ENV -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -ArgumentList @('--verify-build', ('"' + $report + '"'), '--ci') -WorkingDirectory $temporary -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Packaged smoke check failed: $($process.ExitCode)" }
          } finally {
            $env:PATH = $previousPath
            $env:PYTHONPATH = $previousPythonPath
            $env:PYTHONHOME = $previousPythonHome
            $env:VIRTUAL_ENV = $previousEnvironment
            if (Test-Path -LiteralPath $report) {
              Copy-Item -LiteralPath $report -Destination dist/build-verification.json
            }
          }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.success -or -not $result.frozen -or $result.browser_mode -ne 'protocol_only') { throw 'Smoke check did not verify the frozen executable' }
      - name: Package EXE, guide, license and build provenance
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          @("Repository: $env:GITHUB_REPOSITORY", "Commit: $env:GITHUB_SHA", "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID", 'Python: 3.12; Windows x64; desktop r8', 'This smoke check does not authenticate to Twitch or verify live reward accrual.') | Set-Content dist/BUILD-INFO.txt -Encoding utf8
          Compress-Archive -LiteralPath 'dist/Twitch Drops Miner.exe', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'docs/windows-desktop.md', 'dist/build-verification.json', 'dist/BUILD-INFO.txt' -DestinationPath release-assets/Twitch-Drops-Miner-Desktop-Windows-x64.zip
          $hash = (Get-FileHash -LiteralPath release-assets/Twitch-Drops-Miner-Desktop-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Twitch-Drops-Miner-Desktop-Windows-x64.zip" | Set-Content release-assets/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Twitch-Drops-Miner-Desktop-Windows-x64
          path: release-assets/
          if-no-files-found: error
          archive: true
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-windows-test-results
          path: |
            desktop-tests.xml
            dist/build-verification.json
          if-no-files-found: warn
          archive: true
          retention-days: 14
